name: Daily Latest News Auto-Refresh

on:
  schedule:
    # Runs every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run News Updater Script
        run: |
          python update_news_cron.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles_database.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-refresh latest news [skip ci]" && git push)
